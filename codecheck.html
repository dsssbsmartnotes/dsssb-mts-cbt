<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gemini 1.5 Flash API Tester - Final</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<!-- 🟢 FIREBASE SCRIPTS (Fixed 404 Issue) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
    :root { --primary: #4f46e5; --bg: #f8fafc; --text: #1e293b; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; margin-bottom: 20px; }
    .btn { padding: 12px 24px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-primary { background: var(--primary); color: white; width: 100%; font-size: 16px; margin-top: 10px; }
    .btn-primary:active { transform: scale(0.98); }
    #solutionDisplay { margin-top: 25px; padding: 20px; border-radius: 12px; background: #f1f5f9; border-left: 6px solid var(--primary); display: none; line-height: 1.7; font-size: 15px; }
    #status { font-size: 14px; font-weight: bold; margin-bottom: 15px; color: #6366f1; text-align: center; }
    .error-box { background: #fee2e2; color: #b91c1c; padding: 15px; border-radius: 10px; border: 1px solid #fecaca; margin-top: 10px; font-size: 14px; }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="margin:0;">Gemini API Tester 🛠️</h2>
        <div style="padding:5px 10px; background:#e2e8f0; border-radius:5px; font-weight:bold;">HI</div>
    </div>

    <div style="background:#fdfcf0; padding:15px; border-radius:10px; border:1px solid #fef3c7; margin-bottom:20px;">
        <b style="color:#b45309;">Sample Question:</b><br>
        भारत के लौह पुरुष कौन थे? (Iron Man of India)
    </div>

    <div id="status">Ready to test...</div>
    <div id="solutionDisplay"></div>
    
    <button class="btn btn-primary" onclick="testAI()" id="runBtn">Generate Solution (F12 for Console) ➔</button>
</div>

<script>
// --- 1. FIREBASE CONFIGURATION ---
try {
    const firebaseConfig = {
        apiKey: "AIzaSyDGolcXv0efZxRdOvBthfeT72mkNLLbAwI",
        authDomain: "dsssbexamportal.firebaseapp.com",
        databaseURL: "https://dsssbexamportal-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "dsssbexamportal"
    };
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    console.log("✅ Firebase Initialized Successfully!");
} catch (err) {
    console.error("❌ Firebase Init Error:", err);
}

// --- 2. BULLETPROOF AI FETCH FUNCTION ---
async function fetchAISolution() {
    const p1 = "AIzaSyDFmoG4QtYt9rIVjiw"; 
    const p2 = "Uy2eOIrYdzMClAtc"; 
    const API_KEY = p1 + p2; 
    
    const prompt = "You are a teacher. Explain in very short bilingual Hindi/English why Sardar Patel is the Iron Man of India. Return ONLY pure HTML without code blocks.";

    try {
        console.log("🚀 Calling Gemini 1.5 Flash API...");
        
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { 
                    temperature: 0.2, 
                    maxOutputTokens: 300 
                }
            })
        });

        // 🔥 Safety Check: Agar HTML error page aaye toh code crash na ho
        if (!response.ok) {
            const errorText = await response.text();
            console.error("❌ API Failed!", response.status, errorText);
            return `<div class="error-box"><b>API Error (${response.status}):</b> Server rejected the request. Check console.</div>`;
        }

        const data = await response.json();
        console.log("✅ Success Response:", data);

        if (data.error) {
            return `<div class="error-box"><b>API Error:</b> ${data.error.message}</div>`;
        }

        if (data.candidates && data.candidates.length > 0) {
            let rawHtml = data.candidates[0].content.parts[0].text;
            // Markdown formatting (```html) ko saaf karna
            return rawHtml.split('```html').join('').split('```').join('').trim();
        }
        
        return "<div class='error-box'>No result generated by AI.</div>";

    } catch (e) {
        console.error("❌ Code/Network Error:", e);
        return `<div class="error-box"><b>Error:</b> ${e.message}</div>`;
    }
}

// --- 3. BUTTON CLICK HANDLER ---
async function testAI() {
    const status = document.getElementById('status');
    const solBox = document.getElementById('solutionDisplay');
    const btn = document.getElementById('runBtn');
    
    // UI Update during loading
    status.innerText = "⏳ AI is thinking... (Please wait)";
    status.style.color = "#f59e0b";
    solBox.style.display = 'none';
    btn.disabled = true;
    btn.style.opacity = "0.7";

    // Call AI
    const result = await fetchAISolution();
    
    // UI Update after response
    status.innerText = "✨ Done!";
    status.style.color = "#10b981";
    solBox.innerHTML = result;
    solBox.style.display = 'block';
    btn.disabled = false;
    btn.style.opacity = "1";
}
</script>

</body>
</html>
